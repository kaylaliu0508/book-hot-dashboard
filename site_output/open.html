<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>图书创意灵感中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f6f7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  background: #fff;
  border-radius: 12px;
  padding: 40px 32px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.icon {
  width: 64px; height: 64px;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, #e63946, #ff6b6b);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
h1 {
  font-size: 18px;
  color: #1a1a1a;
  margin-bottom: 8px;
  font-weight: 600;
}
.desc {
  font-size: 14px;
  color: #666;
  margin-bottom: 24px;
  line-height: 1.6;
}
.steps {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 24px;
  text-align: left;
}
.step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 14px;
  color: #333;
  line-height: 1.5;
}
.step:last-child { margin-bottom: 0; }
.step-num {
  width: 20px; height: 20px;
  background: #e63946;
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}
.btn {
  display: block;
  width: 100%;
  padding: 12px;
  background: #e63946;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s;
}
.btn:hover { background: #d32f3f; }
.btn:active { background: #c0252e; }
.copy-toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
}
.copy-toast.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.url-display {
  background: #f0f0f0;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 16px;
  font-size: 12px;
  color: #333;
  word-break: break-all;
  text-align: left;
  font-family: monospace;
}
.tip {
  font-size: 12px;
  color: #999;
  margin-top: 16px;
}
</style>
</head>
<body>

<div class="card">
  <div class="icon">📊</div>
  <h1>图书创意灵感中心</h1>
  <p class="desc">由于微信安全策略限制，请在浏览器中打开查看</p>

  <div class="steps">
    <div class="step">
      <span class="step-num">1</span>
      <span>点击下方按钮<strong>复制链接</strong></span>
    </div>
    <div class="step">
      <span class="step-num">2</span>
      <span>点击右上角 <strong>···</strong> 菜单</span>
    </div>
    <div class="step">
      <span class="step-num">3</span>
      <span>选择 <strong>「在浏览器中打开」</strong></span>
    </div>
  </div>

  <div class="url-display" id="urlBox">https://book-hot-dashboard.pages.dev/summer/</div>

  <button class="btn" onclick="copyUrl()">📋 复制链接</button>

  <p class="tip">或直接点击右上角 ··· → 在浏览器中打开本页</p>
</div>

<div class="copy-toast" id="toast">✅ 链接已复制，请在浏览器中打开</div>

<script>
var TARGET_URL = 'https://book-hot-dashboard.pages.dev/summer/';

// 非微信环境直接跳转
if (!/MicroMessenger/i.test(navigator.userAgent)) {
  location.replace(TARGET_URL);
}

function copyUrl() {
  var url = TARGET_URL;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(showToast).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

function fallbackCopy() {
  var input = document.createElement('input');
  input.value = TARGET_URL;
  input.style.position = 'fixed';
  input.style.opacity = '0';
  document.body.appendChild(input);
  input.select();
  input.setSelectionRange(0, 999);
  document.execCommand('copy');
  document.body.removeChild(input);
  showToast();
}

function showToast() {
  var t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
</script>

</body>
</html>
