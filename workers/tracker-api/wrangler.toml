name = "tracker-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# === KV 聚合命名空间（部署前需用 wrangler kv namespace create TRACKER_AGG 创建并替换 id） ===
[[kv_namespaces]]
binding = "TRACKER_AGG"
id = "2360767d707143e394cf90766faf418c"
preview_id = "fcf318ad1b6544259581821b51b43342"

# === R2 原始日志（可选，先注释；要开就 uncomment 并 wrangler r2 bucket create tracker-raw） ===
# [[r2_buckets]]
# binding = "TRACKER_RAW"
# bucket_name = "tracker-raw"

# === 环境变量 ===
[vars]
ALLOWED_ORIGINS = "https://book-hot-dashboard.pages.dev,https://book-hot-dashboard.1012513527.workers.dev"
RETENTION_DAYS = "90"
ENABLE_RAW_LOG = "false"   # 设为 true 时同时写 R2
